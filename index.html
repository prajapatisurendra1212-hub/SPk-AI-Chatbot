<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPK AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
    }

    .header p {
      font-size: 13px;
      margin-top: 5px;
      color: #cbd5e1;
    }

    /* API Section */
    .api-section {
      padding: 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .api-section input {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .api-section button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .api-section button:hover {
      background: #1d4ed8;
    }

    /* Chat */
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #ffffff;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 3px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 3px;
    }

    /* Input Area */
    .input-area {
      display: flex;
      padding: 12px;
      gap: 8px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .send-btn {
      width: 80px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .send-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>🤖 SPK AI Chatbot</h1>
      <p>Powered by Groq API</p>
    </div>

    <!-- API KEY -->
    <div class="api-section">
      <input
        type="password"
        id="apiKey"
        placeholder="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"
      >

      <button onclick="saveApiKey()">
        Save API Key
      </button>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">

      <div class="message bot">
        Hello! 👋 I am SPK AI. How can I help you?
      </div>

    </div>

    <div class="status" id="status">
      Ready
    </div>

    <!-- MESSAGE INPUT -->
    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send-btn"
        id="sendBtn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <script>

    // Groq API URL
    const API_URL = "https://api.groq.com/openai/v1/chat/completions";

    // Groq model
    const MODEL = "llama-3.3-70b-versatile";

    // Save API Key
    function saveApiKey() {

      const key = document.getElementById("apiKey").value.trim();

      if (!key) {
        alert("Please enter your Groq API Key.");
        return;
      }

      localStorage.setItem("spk_groq_api_key", key);

      document.getElementById("status").innerText =
        "API Key saved successfully";

      alert("API Key saved!");

    }


    // Load saved API key
    window.onload = function () {

      const savedKey =
        localStorage.getItem("spk_groq_api_key");

      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
        document.getElementById("status").innerText =
          "API Key loaded";
      }

    };


    // Enter key
    function handleEnter(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }


    // Add message to chat
    function addMessage(text, type) {

      const chatBox =
        document.getElementById("chatBox");

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chatBox.appendChild(message);

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    // Send Message
    async function sendMessage() {

      const input =
        document.getElementById("userInput");

      const sendBtn =
        document.getElementById("sendBtn");

      const status =
        document.getElementById("status");

      const message =
        input.value.trim();

      if (!message) {
        return;
      }


      // Get API key
      const apiKey =
        document.getElementById("apiKey").value.trim()
        || localStorage.getItem("spk_groq_api_key");


      if (!apiKey) {

        alert(
          "Please enter your Groq API Key first."
        );

        return;

      }


      // Show user message
      addMessage(message, "user");

      input.value = "";

      sendBtn.disabled = true;

      status.innerText = "SPK AI is thinking...";


      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + apiKey

          },

          body: JSON.stringify({

            model: MODEL,

            messages: [

              {
                role: "system",

                content:
                  "You are SPK AI, a helpful and friendly AI assistant. Answer clearly and accurately."
              },

              {
                role: "user",

                content: message
              }

            ],

            temperature: 0.7,

            max_tokens: 1024

          })

        });


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error?.message ||
            "API request failed"
          );

        }


        const reply =
          data.choices?.[0]?.message?.content;


        if (!reply) {

          throw new Error(
            "No response received from Groq."
          );

        }


        // Show AI response
        addMessage(reply, "bot");

        status.innerText = "Ready";


      } catch (error) {

        console.error(error);

        addMessage(
          "❌ Error: " + error.message,
          "bot"
        );

        status.innerText =
          "Something went wrong";

      }


      sendBtn.disabled = false;

      input.focus();

    }

  </script>

</body>
</html>
