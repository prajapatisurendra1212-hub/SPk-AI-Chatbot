<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 13px;
      margin-top: 5px;
      color: #cbd5e1;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      background: white;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      font-size: 15px;
    }

    #sendBtn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendBtn:hover {
      background: #1d4ed8;
    }

    #sendBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .typing {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .chat-container {
        height: 100vh;
        border-radius: 0;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>🤖 My AI Assistant</h1>
      <p>Powered by Grok API</p>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message ai">
        <div class="bubble">
          Hello! 👋 I'm your AI Assistant.
          How can I help you today?
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
        autocomplete="off"
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

  <script>

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let messages = [
      {
        role: "system",
        content:
          "You are a helpful, friendly and intelligent AI assistant. Give clear and useful answers."
      }
    ];


    function addMessage(text, sender) {

      const messageDiv = document.createElement("div");

      messageDiv.className = `message ${sender}`;

      const bubble = document.createElement("div");

      bubble.className = "bubble";

      bubble.textContent = text;

      messageDiv.appendChild(bubble);

      chatBox.appendChild(messageDiv);

      chatBox.scrollTop = chatBox.scrollHeight;
    }


    async function sendMessage() {

      const text = userInput.value.trim();

      if (!text || sendBtn.disabled) {
        return;
      }

      addMessage(text, "user");

      userInput.value = "";

      messages.push({
        role: "user",
        content: text
      });


      const typing = document.createElement("div");

      typing.className = "typing";
      typing.id = "typing";
      typing.textContent = "AI is thinking...";

      chatBox.appendChild(typing);

      chatBox.scrollTop = chatBox.scrollHeight;

      sendBtn.disabled = true;


      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            messages: messages
          })

        });


        const data = await response.json();

        document.getElementById("typing")?.remove();


        if (!response.ok) {

          console.error("Server error:", data);

          throw new Error(
            data?.error?.message ||
            "Groq API request failed"
          );
        }


        const aiReply =
          data?.choices?.[0]?.message?.content ||
          "Sorry, I couldn't generate a response.";


        addMessage(aiReply, "ai");


        messages.push({
          role: "assistant",
          content: aiReply
        });


      } catch (error) {

        document.getElementById("typing")?.remove();

        console.error(error);

        addMessage(
          "❌ Groq API से connection नहीं हो पाया। Server और API key check करें.",
          "ai"
        );

      } finally {

        sendBtn.disabled = false;

        userInput.focus();

      }

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    userInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
